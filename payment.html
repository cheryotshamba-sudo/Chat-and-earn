<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat & Earn - Payment</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #000;
    color: #fff;
    font-family: 'Poppins', sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px 14px;
}

.container {
    width: 100%;
    max-width: 430px;
}

.logo {
    text-align: center;
    font-family: 'Mali', cursive;
    font-size: 30px;
    font-weight: 700;
    margin-bottom: 5px;
}

.logo span {
    color: #00A651;
}

.tagline {
    text-align: center;
    color: #aaa;
    font-size: 12px;
    margin-bottom: 20px;
}

.card {
    background: #111;
    border: 1px solid #242424;
    border-radius: 20px;
    padding: 24px 18px;
    box-shadow: 0 10px 35px rgba(0,0,0,.5);
}

.badge {
    display: inline-block;
    background: #00A651;
    color: #fff;
    font-size: 11px;
    font-weight: 800;
    padding: 7px 13px;
    border-radius: 30px;
    margin-bottom: 14px;
}

h1 {
    font-size: 24px;
    line-height: 1.25;
    font-weight: 800;
    margin-bottom: 10px;
}

.description {
    color: #bbb;
    font-size: 13px;
    line-height: 1.7;
    margin-bottom: 18px;
}

.price-box {
    background: #071b11;
    border: 1px solid #00A651;
    border-radius: 15px;
    padding: 15px;
    text-align: center;
    margin-bottom: 20px;
}

.price-label {
    color: #aaa;
    font-size: 12px;
    margin-bottom: 3px;
}

.price {
    color: #00A651;
    font-size: 32px;
    font-weight: 800;
}

label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 8px;
}

input {
    width: 100%;
    height: 52px;
    border-radius: 12px;
    border: 1px solid #333;
    background: #080808;
    color: #fff;
    padding: 0 15px;
    font-family: 'Poppins', sans-serif;
    font-size: 15px;
    outline: none;
    margin-bottom: 13px;
}

input:focus {
    border-color: #00A651;
}

button {
    width: 100%;
    height: 54px;
    border: none;
    border-radius: 13px;
    background: #00A651;
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
}

.message {
    display: none;
    margin-top: 15px;
    padding: 13px;
    border-radius: 12px;
    text-align: center;
    font-size: 13px;
    line-height: 1.5;
}

.message.info {
    display: block;
    background: #101a24;
    border: 1px solid #315b7d;
    color: #8ecaff;
}

.message.success {
    display: block;
    background: #092217;
    border: 1px solid #00A651;
    color: #55d98c;
}

.message.error {
    display: block;
    background: #241010;
    border: 1px solid #8d2929;
    color: #ff7777;
}

.secure {
    text-align: center;
    color: #777;
    font-size: 10px;
    margin-top: 16px;
}

</style>

</head>

<body>

<div class="container">

    <div class="logo">
        🌍 Chat <span>&</span> Earn
    </div>

    <div class="tagline">
        Connect • Chat • Learn • Earn
    </div>

    <div class="card">

        <div class="badge">
            🔐 ACCOUNT ACTIVATION
        </div>

        <h1>
            Activate Your Account
        </h1>

        <p class="description">
            Activate your Chat & Earn account using M-PESA. Once your payment is confirmed, you will continue to Premium Interest Matching.
        </p>

        <div class="price-box">

            <div class="price-label">
                Account Activation
            </div>

            <div class="price">
                KSh 100
            </div>

        </div>

        <label for="phone">
            M-PESA Phone Number
        </label>

        <input
            type="tel"
            id="phone"
            placeholder="0706338937"
            maxlength="13"
            autocomplete="tel"
        >

        <button id="payBtn" onclick="startPayment()">
            PAY KSh 100 & ACTIVATE
        </button>

        <div id="message" class="message"></div>

        <div class="secure">
            🔒 Secure M-PESA payment
        </div>

    </div>

</div>


<script>

const BACKEND_URL =
    "https://chat-and-earn-backend.onrender.com";

let reference = null;
let polling = null;
let attempts = 0;

const MAX_ATTEMPTS = 60;


/* =========================
   MESSAGE
========================= */

function showMessage(text, type) {

    const message =
        document.getElementById("message");

    message.className =
        "message " + type;

    message.innerHTML = text;
}


/* =========================
   PHONE CLEANING
========================= */

function cleanPhone(phone) {

    phone = phone.replace(/\s+/g, "");

    if (phone.startsWith("+254")) {
        phone = phone.substring(1);
    }

    if (phone.startsWith("07") ||
        phone.startsWith("01")) {

        phone =
            "254" + phone.substring(1);
    }

    return phone;
}


/* =========================
   PHONE VALIDATION
========================= */

function validPhone(phone) {

    return /^254(7|1)\d{8}$/.test(phone);
}


/* =========================
   START PAYMENT
========================= */

async function startPayment() {

    const input =
        document.getElementById("phone");

    const button =
        document.getElementById("payBtn");

    const phone =
        cleanPhone(input.value.trim());


    if (!validPhone(phone)) {

        showMessage(
            "Please enter a valid Kenyan M-PESA number, for example 0706338937.",
            "error"
        );

        return;
    }


    button.disabled = true;

    button.innerText =
        "SENDING M-PESA PROMPT...";


    showMessage(
        "Please wait. An M-PESA payment prompt is being sent to your phone.",
        "info"
    );


    try {

        const response = await fetch(
            BACKEND_URL + "/stkpush",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    phone: phone,

                    paymentType:
                        "activation"

                })
            }
        );


        const data =
            await response.json();


        console.log(
            "STK RESPONSE:",
            data
        );


        if (!response.ok ||
            !data.success) {

            throw new Error(
                data.message ||
                "Unable to start payment."
            );
        }


        reference =
            data.reference;


        if (!reference) {

            throw new Error(
                "Payment reference was not returned by the server."
            );
        }


        attempts = 0;


        showMessage(
            "M-PESA prompt sent. Enter your M-PESA PIN to pay KSh 100.",
            "info"
        );


        pollPayment();


    } catch (error) {

        console.error(error);


        button.disabled = false;

        button.innerText =
            "PAY KSh 100 & ACTIVATE";


        showMessage(
            error.message ||
            "Unable to start payment. Please try again.",
            "error"
        );
    }

}


/* =========================
   POLL PAYMENT
========================= */

async function pollPayment() {

    if (!reference) {
        return;
    }


    attempts++;


    if (attempts > MAX_ATTEMPTS) {

        clearTimeout(polling);


        const button =
            document.getElementById("payBtn");

        button.disabled = false;

        button.innerText =
            "PAY KSh 100 & ACTIVATE";


        showMessage(
            "We are still waiting for payment confirmation. If you already paid, please wait a moment and try again.",
            "error"
        );

        return;
    }


    try {

        const response = await fetch(

            BACKEND_URL +
            "/payment-status/" +
            encodeURIComponent(reference)

        );


        const data =
            await response.json();


        console.log(
            "PAYMENT STATUS:",
            data
        );


        /*
         * Accept different capitalizations
         * returned by the backend.
         */

        const status =
            String(data.status || "")
            .toLowerCase();


        /* =========================
           PAYMENT SUCCESS
        ========================= */

        if (
            status === "completed" ||
            status === "complete" ||
            status === "success" ||
            status === "successful" ||
            status === "confirmed"
        ) {

            clearTimeout(polling);


            showMessage(
                "✅ Payment successful! Account activated. Redirecting...",
                "success"
            );


            document.getElementById(
                "payBtn"
            ).style.display = "none";


            document.getElementById(
                "phone"
            ).style.display = "none";


            /*
             * Save activation state.
             */

            localStorage.setItem(
                "chatEarnActivated",
                "true"
            );


            localStorage.setItem(
                "chatEarnActivationReference",
                reference
            );


            /*
             * IMPORTANT:
             * Go to the next page.
             */

            setTimeout(function() {

                window.location.replace(
                    "premium-interests.html"
                );

            }, 1200);


            return;
        }


        /* =========================
           PAYMENT FAILED
        ========================= */

        if (
            status === "failed" ||
            status === "cancelled" ||
            status === "canceled" ||
            status === "rejected"
        ) {

            clearTimeout(polling);


            const button =
                document.getElementById("payBtn");


            button.disabled = false;

            button.innerText =
                "PAY KSh 100 & ACTIVATE";


            showMessage(
                "Payment was not completed. Please try again.",
                "error"
            );


            return;
        }


        /* =========================
           STILL WAITING
        ========================= */

        showMessage(
            "Waiting for M-PESA confirmation... Please complete the payment on your phone.",
            "info"
        );


        polling =
            setTimeout(
                pollPayment,
                3000
            );


    } catch (error) {

        console.error(
            "STATUS CHECK ERROR:",
            error
        );


        /*
         * Don't immediately fail the payment.
         * Keep checking because the network
         * may temporarily fail.
         */

        polling =
            setTimeout(
                pollPayment,
                3000
            );
    }

}

</script>

</body>
</html>
