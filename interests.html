<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat & Earn</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    min-height: 100%;
}

body {
    background: #000000;
    color: #ffffff;
    font-family: 'Poppins', sans-serif;
}

.container {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: 14px 12px 18px;
}


/* HEADER */

.header {
    text-align: center;
    margin-bottom: 15px;
}

.logo {
    width: 56px;
    height: 56px;

    margin: 0 auto 8px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #00A651;

    border-radius: 50%;

    font-size: 30px;

    box-shadow:
        0 5px 18px rgba(0,166,81,0.25);
}

.header h1 {
    font-family: 'Poppins', sans-serif;

    color: #ffffff;

    font-size: 30px;

    line-height: 1.1;

    font-weight: 900;

    margin-bottom: 5px;
}

.header h1 span {
    color: #00A651;
}

.header p {
    font-family: 'Mali', cursive;

    color: #dddddd;

    font-size: 13px;

    font-weight: 600;
}


/* CARD */

.card {
    background: #111111;

    border: 1px solid #2c2c2c;

    border-radius: 16px;

    padding: 17px 13px;
}

.card h2 {
    color: #ffffff;

    font-size: 19px;

    font-weight: 900;

    margin-bottom: 4px;
}

.card-description {
    color: #999999;

    font-family: 'Mali', cursive;

    font-size: 11px;

    font-weight: 600;

    margin-bottom: 14px;
}


/* INTERESTS */

.interests {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 9px;

    width: 100%;
}


/* INTEREST */

.interest {
    min-height: 56px;

    padding: 8px 6px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 6px;

    background: #000000;

    border: 2px solid #333333;

    border-radius: 10px;

    color: #ffffff;

    font-family: 'Mali', cursive;

    font-size: 11px;

    font-weight: 700;

    line-height: 1.15;

    text-align: center;

    cursor: pointer;

    transition: 0.2s ease;
}

.interest input {
    width: 17px;
    height: 17px;

    flex-shrink: 0;

    accent-color: #00A651;
}


/* SELECTED */

.interest:has(input:checked) {
    background: #006B3F;

    border-color: #00A651;
}


/* CONTINUE */

.continue-btn {
    width: 100%;

    height: 55px;

    margin-top: 15px;

    background: #00A651;

    color: #ffffff;

    border: none;

    border-radius: 10px;

    font-family: 'Poppins', sans-serif;

    font-size: 18px;

    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 5px 15px rgba(0,166,81,0.25);
}

.continue-btn:active {
    transform: scale(0.98);
}


/* FOOTER */

.footer {
    text-align: center;

    padding-top: 12px;
}

.footer p {
    color: #777777;

    font-family: 'Mali', cursive;

    font-size: 10px;

    font-weight: 600;
}


/* SMALL PHONES */

@media (max-width: 360px) {

    .container {
        padding: 9px 9px 14px;
    }

    .logo {
        width: 48px;
        height: 48px;
        font-size: 25px;
    }

    .header h1 {
        font-size: 26px;
    }

    .header p {
        font-size: 11px;
    }

    .card {
        padding: 14px 10px;
    }

    .interest {
        min-height: 51px;
        font-size: 10px;
    }

    .interest input {
        width: 15px;
        height: 15px;
    }

    .continue-btn {
        height: 51px;
        font-size: 17px;
    }
}

</style>

</head>

<body>


<div class="container">


    <div class="header">

        <div class="logo">
            🌍
        </div>

        <h1>
            Chat <span>&</span> Earn
        </h1>

        <p>
            Select your interests
        </p>

    </div>


    <div class="card">

        <h2>
            Select Your Interests
        </h2>

        <p class="card-description">
            Choose what you would like to connect and earn from.
        </p>


        <form id="interestForm">


            <div class="interests">


                <label class="interest">
                    <input type="checkbox"
                           name="interest"
                           value="Friendship">
                    🤝 Friendship
                </label>


                <label class="interest">
                    <input type="checkbox"
                           name="interest"
                           value="Dating">
                    ❤️ Dating
                </label>


                <label class="interest">
                    <input type="checkbox"
                           name="interest"
                           value="Remote Jobs">
                    💼 Remote Jobs
                </label>


                <label class="interest">
                    <input type="checkbox"
                           name="interest"
                           value="Business">
                    📈 Business
                </label>


                <label class="interest">
                    <input type="checkbox"
                           name="interest"
                           value="Travel">
                    ✈️ Travel
                </label>


                <label class="interest">
                    <input type="checkbox"
                           name="interest"
                           value="Language Exchange">
                    🗣️ Language Exchange
                </label>


                <label class="interest">
                    <input type="checkbox"
                           name="interest"
                           value="Teaching Kiswahili">
                    📚 Teaching Kiswahili
                </label>


                <label class="interest">
                    <input type="checkbox"
                           name="interest"
                           value="International Networking">
                    🌍 International Networking
                </label>


                <label class="interest">
                    <input type="checkbox"
                           name="interest"
                           value="Earn Money Online">
                    💰 Earn Money Online
                </label>


                <label class="interest">
                    <input type="checkbox"
                           name="interest"
                           value="Culture">
                    🎭 Culture
                </label>


            </div>


            <button
                type="submit"
                class="continue-btn"
            >
                Continue
            </button>


        </form>

    </div>


    <div class="footer">

        <p>
            Chat • Connect • Learn • Earn
        </p>

    </div>


</div>


<script>

document
.getElementById("interestForm")
.addEventListener("submit", function(e) {

    e.preventDefault();

    let selectedInterests = [];

    document
    .querySelectorAll(
        'input[name="interest"]:checked'
    )
    .forEach(function(item) {

        selectedInterests.push(item.value);

    });


    if (selectedInterests.length === 0) {

        alert(
            "Please select at least one interest."
        );

        return;
    }


    localStorage.setItem(
        "interests",
        JSON.stringify(selectedInterests)
    );


    window.location.href = "payment.html";

});

</script>

</body>
</html>
