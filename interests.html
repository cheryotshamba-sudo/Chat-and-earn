<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GlobalLink Kenya | Your Interests</title><link rel="stylesheet" href="style.css"><style>

/* INTERESTS PAGE */

.interests {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 15px;
}

.interest {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 58px;
    padding: 12px;
    border: 2px solid #f1d5df;
    border-radius: 12px;
    background: #fff;
    color: #333;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    transition: 0.2s ease;
}

.interest:hover {
    border-color: #E91E63;
    background: #fff5f8;
}

.interest input {
    width: 20px;
    height: 20px;
    margin: 0;
    accent-color: #E91E63;
    cursor: pointer;
}

.interest:has(input:checked) {
    border-color: #E91E63;
    background: #fce4ec;
    color: #E91E63;
}

#interestForm h2 {
    text-align: center;
    font-size: 21px;
    font-weight: 900;
    margin-bottom: 5px;
}

.interest-note {
    text-align: center;
    color: #777;
    font-size: 13px;
    margin-bottom: 15px;
}

.interests-btn {
    width: 100%;
    height: 58px;
    margin-top: 20px;
    border: none;
    border-radius: 12px;
    background: #E91E63;
    color: #fff;
    font-size: 20px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 7px 18px rgba(233, 30, 99, 0.28);
}

.interests-btn:active {
    transform: scale(0.98);
}

@media (max-width: 420px) {

    .interests {
        grid-template-columns: 1fr;
    }

}

</style></head><body><div class="page"><div class="container"><div class="header">

    <div class="logo">🌍</div>

    <h1>GlobalLink Kenya</h1>

    <div class="tagline">
        CHAT • LEARN • EARN
    </div>

    <p>
        Tell us what you're interested in so we can
        connect you with the right people.
    </p>

</div>

<div class="card">

    <form id="interestForm">

        <h2>Select Your Interests</h2>

        <p class="interest-note">
            Choose one or more interests
        </p>

        <div class="interests">

            <label class="interest">
                <input type="checkbox" name="interest" value="Friendship">
                🤝 Friendship
            </label>

            <label class="interest">
                <input type="checkbox" name="interest" value="Dating">
                ❤️ Dating
            </label>

            <label class="interest">
                <input type="checkbox" name="interest" value="Remote Jobs">
                💼 Remote Jobs
            </label>

            <label class="interest">
                <input type="checkbox" name="interest" value="Business">
                📈 Business
            </label>

            <label class="interest">
                <input type="checkbox" name="interest" value="Travel">
                ✈️ Travel
            </label>

            <label class="interest">
                <input type="checkbox" name="interest" value="Language Exchange">
                🗣️ Language Exchange
            </label>

            <label class="interest">
                <input type="checkbox" name="interest" value="Teaching Kiswahili">
                📚 Teaching Kiswahili
            </label>

            <label class="interest">
                <input type="checkbox" name="interest" value="International Networking">
                🌍 International Networking
            </label>

            <label class="interest">
                <input type="checkbox" name="interest" value="Earn Money Online">
                💰 Earn Money Online
            </label>

            <label class="interest">
                <input type="checkbox" name="interest" value="Culture">
                🎭 Culture
            </label>

        </div>

        <button type="submit" class="interests-btn">
            CONTINUE →
        </button>

    </form>

</div>

<div class="footer">
    <p>🌍 Connect globally • 💬 Chat • 💰 Earn</p>
</div>

</div></div><script>

document.getElementById("interestForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const selectedInterests = [];

    document
        .querySelectorAll('input[name="interest"]:checked')
        .forEach(function(item) {
            selectedInterests.push(item.value);
        });

    if (selectedInterests.length === 0) {
        alert("Please select at least one interest.");
        return;
    }

    localStorage.setItem(
        "interests",
        JSON.stringify(selectedInterests)
    );

    const button = document.querySelector(".interests-btn");

    button.disabled = true;
    button.innerHTML = "PLEASE WAIT...";

    setTimeout(function() {
        window.location.href = "payment.html";
    }, 500);

});

</script></body>
</html>
