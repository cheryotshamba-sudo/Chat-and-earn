<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GlobalLink Kenya | Interests</title><link rel="stylesheet" href="style.css"><style>

body {
    background: #000000;
    color: #ffffff;
}

.page {
    background: #000000;
}

.header h1 {
    color: #ff2b8a;
}

.header p {
    color: #ffffff;
}

.card {
    background: #000000;
    border: 1px solid #333333;
    box-shadow: none;
}

.card h2 {
    color: #ffffff;
}

.interest-note {
    color: #cccccc;
}

/* LEFT TO RIGHT SCROLLING INTERESTS */

.interests {
    display: flex;
    flex-direction: row;
    gap: 10px;

    overflow-x: auto;
    overflow-y: hidden;

    padding: 8px 2px 15px;

    scroll-behavior: smooth;

    -webkit-overflow-scrolling: touch;

    scrollbar-width: none;
}

.interests::-webkit-scrollbar {
    display: none;
}

.interest {
    flex: 0 0 auto;

    min-width: 145px;
    min-height: 58px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 7px;

    padding: 12px 15px;

    background: #111111;

    border: 2px solid #444444;
    border-radius: 12px;

    color: #ffffff;

    font-size: 14px;
    font-weight: 900;

    white-space: nowrap;

    cursor: pointer;
}

.interest:hover {
    border-color: #ff2b8a;
}

.interest input {
    width: 19px;
    height: 19px;

    margin: 0;

    accent-color: #ff2b8a;

    flex-shrink: 0;
}

.interest:has(input:checked) {
    background: #ff2b8a;
    border-color: #ff2b8a;
    color: #ffffff;
}

.interests-btn {
    width: 100%;
    height: 60px;

    margin-top: 20px;

    background: #ff2b8a;
    color: #ffffff;

    border: none;
    border-radius: 12px;

    font-size: 21px;
    font-weight: 900;

    cursor: pointer;

    box-shadow: 0 5px 20px rgba(255, 43, 138, 0.35);
}

.interests-btn:active {
    transform: scale(0.98);
}

.interests-btn:disabled {
    opacity: 0.7;
}

</style></head><body><div class="page"><div class="container"><div class="header">

    <div class="logo">🌍</div>

    <h1>GlobalLink Kenya</h1>

    <div class="tagline">
        CHAT • LEARN • EARN
    </div>

    <p>
        Choose what you are interested in and
        connect with the right people.
    </p>

</div>

<div class="card">

    <form id="interestForm">

        <h2>Select Your Interests</h2>

        <p class="interest-note">
            Swipe left or right to see more
        </p>

        <div class="interests">

            <label class="interest">
                <input type="checkbox" name="interest" value="Friendship">
                🤝 Friendship
            </label>

            <label class="interest">
                <input type="checkbox" name="interest" value="Dating">
                ❤️ Dating
            </label>

            <label class="interest">
                <input type="checkbox" name="interest" value="Remote Jobs">
                💼 Remote Jobs
            </label>

            <label class="interest">
                <input type="checkbox" name="interest" value="Business">
                📈 Business
            </label>

            <label class="interest">
                <input type="checkbox" name="interest" value="Travel">
                ✈️ Travel
            </label>

            <label class="interest">
                <input type="checkbox" name="interest" value="Language Exchange">
                🗣️ Language Exchange
            </label>

            <label class="interest">
                <input type="checkbox" name="interest" value="Teaching Kiswahili">
                📚 Teaching Kiswahili
            </label>

            <label class="interest">
                <input type="checkbox" name="interest" value="International Networking">
                🌍 International Networking
            </label>

            <label class="interest">
                <input type="checkbox" name="interest" value="Earn Money Online">
                💰 Earn Money Online
            </label>

            <label class="interest">
                <input type="checkbox" name="interest" value="Culture">
                🎭 Culture
            </label>

        </div>

        <button
            type="submit"
            class="interests-btn"
            id="interestButton"
        >
            CONTINUE →
        </button>

    </form>

</div>

<div class="footer">
    <p>🌍 Connect globally • 💬 Chat • 💰 Earn</p>
</div>

</div></div><script>

document.getElementById("interestForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const selectedInterests = [];

    document
        .querySelectorAll('input[name="interest"]:checked')
        .forEach(function(item) {
            selectedInterests.push(item.value);
        });

    if (selectedInterests.length === 0) {
        alert("Please select at least one interest.");
        return;
    }

    localStorage.setItem(
        "interests",
        JSON.stringify(selectedInterests)
    );

    const button = document.getElementById("interestButton");

    button.disabled = true;
    button.innerHTML = "LOADING PAYMENT...";

    setTimeout(function() {
        window.location.href = "payment.html";
    }, 500);

});

</script></body>
</html>
