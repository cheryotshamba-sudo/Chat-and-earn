<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GlobalLink Kenya | Chat & Earn</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="page">

    <div class="container">

        <div class="header">

            <div class="logo">🌍</div>

            <h1>GlobalLink Kenya</h1>

            <div class="tagline">
                CHAT • LEARN • EARN
            </div>

            <p>
                Connect with people from around the world,
                practice Kiswahili, make new friends and earn
                from your conversations.
            </p>

        </div>

        <div class="card">

            <h2>Create Your Profile</h2>

            <p class="intro">
                Register below to get started.
            </p>

            <form id="registrationForm">

                <div class="field">
                    <label for="fullname">Full Name</label>

                    <input
                        type="text"
                        id="fullname"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="field">
                    <label for="age">Age</label>

                    <input
                        type="number"
                        id="age"
                        placeholder="18 - 99"
                        min="18"
                        max="99"
                        required
                    >
                </div>

                <div class="field">
                    <label for="gender">Gender</label>

                    <select id="gender" required>

                        <option value="">
                            Select Gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                    </select>
                </div>

                <div class="field">
                    <label for="county">County</label>

                    <select id="county" required>

                        <option value="">
                            Select County
                        </option>

                        <option>Nairobi</option>
                        <option>Mombasa</option>
                        <option>Kisumu</option>
                        <option>Nakuru</option>
                        <option>Uasin Gishu</option>
                        <option>Kiambu</option>
                        <option>Machakos</option>
                        <option>Kakamega</option>
                        <option>Meru</option>
                        <option>Nyeri</option>
                        <option>Other</option>

                    </select>
                </div>

                <div class="field">
                    <label for="phone">Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="07XXXXXXXX"
                        inputmode="numeric"
                        autocomplete="tel"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="continue-btn"
                    id="continueBtn"
                >
                    CONTINUE
                    <span>→</span>
                </button>

            </form>

        </div>

        <div class="footer">
            <p>
                🌍 Connect globally • 💬 Chat • 💰 Earn
            </p>
        </div>

    </div>

</div>


<script>

const form = document.getElementById("registrationForm");

const button = document.getElementById("continueBtn");


form.addEventListener("submit", function(e) {

    e.preventDefault();

    const fullname =
        document.getElementById("fullname").value.trim();

    const age =
        document.getElementById("age").value;

    const gender =
        document.getElementById("gender").value;

    const county =
        document.getElementById("county").value;

    const phone =
        document.getElementById("phone").value.trim();


    if (
        !fullname ||
        !age ||
        !gender ||
        !county ||
        !phone
    ) {

        alert("Please complete all the required fields.");

        return;
    }


    if (
        Number(age) < 18 ||
        Number(age) > 99
    ) {

        alert("You must be between 18 and 99 years old.");

        return;
    }


    localStorage.setItem("fullname", fullname);
    localStorage.setItem("age", age);
    localStorage.setItem("gender", gender);
    localStorage.setItem("county", county);
    localStorage.setItem("phone", phone);


    button.disabled = true;

    button.innerHTML = "PLEASE WAIT...";


    setTimeout(function() {

        window.location.href = "interests.html";

    }, 500);

});

</script>

</body>
</html>
